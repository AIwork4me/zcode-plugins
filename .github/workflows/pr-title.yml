name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Allowed: feat|fix|docs|chore|refactor|test|ci, optional kebab-case
          # scope (usually the plugin name), optional "!", then ": <subject>".
          # The PR title becomes the squash commit message on main.
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|ci)(\([a-z0-9]+(-[a-z0-9]+)*\))?!?: .+'; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(my-plugin): add my-plugin v0.1.0'"
            echo "Got: $TITLE"
            exit 1
          fi
